name: Execute Code Analyzer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually click a button to run it

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          # If your script requires external libraries (like requests or PyGithub),
          # uncomment the line below or install them explicitly:
          # pip install requests
          echo "No dependencies specified, skipping install step."

      - name: Run Analyzer Script
        run: python .github/workflows/analyze.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
